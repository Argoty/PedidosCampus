services:
  auth-db:
    image: postgres:16-alpine
    container_name: pedidoscampus-auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth_db
    ports:
      - '5433:5432'
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth_user -d auth_db']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    container_name: pedidoscampus-auth-service
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      AUTH_DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD}@auth-db:5432/auth_db?schema=public
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      BCRYPT_SALT_ROUNDS: 10
      COOKIE_SECURE: 'false'
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - '3001:3001'
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    container_name: pedidoscampus-user-db
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_password}
      POSTGRES_DB: user_db
    ports:
      - '5434:5432'
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user_user -d user_db']
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    container_name: pedidoscampus-user-service
    build:
      context: ./microservices/user-service
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Host=user-db;Port=5432;Database=user_db;Username=user_user;Password=${USER_DB_PASSWORD:-user_password}"
    depends_on:
      user-db:
        condition: service_healthy
    ports:
      - '5000:5000'
    restart: unless-stopped

volumes:
  auth_postgres_data:
  user_postgres_data:
