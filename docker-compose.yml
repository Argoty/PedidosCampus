services:
  auth-db:
    image: postgres:16-alpine
    container_name: pedidoscampus-auth-db
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    container_name: pedidoscampus-auth-service
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      AUTH_DATABASE_URL: postgresql://auth_user:${AUTH_DB_PASSWORD}@auth-db:5432/auth_db?schema=public
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      USER_SERVICE_URL: http://user-service:5000
      BCRYPT_SALT_ROUNDS: 10
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    container_name: pedidoscampus-user-db
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-user_password}
      POSTGRES_DB: user_db
    ports:
      - "5434:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    container_name: pedidoscampus-user-service
    build:
      context: ./microservices/user-service
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${USER_SERVICE_ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${USER_SERVICE_ASPNETCORE_URLS:-http://+:5000}
      ConnectionStrings__DefaultConnection: "Host=user-db;Port=5432;Database=user_db;Username=user_user;Password=${USER_DB_PASSWORD:-user_password}"
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      Jwt__AccessTokenSecret: ${ACCESS_TOKEN_SECRET}
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

  restaurant-db:
    image: postgres:16-alpine
    container_name: pedidoscampus-restaurant-db
    environment:
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD:-restaurant_password}
      POSTGRES_DB: restaurant_db
    ports:
      - "5435:5432"
    volumes:
      - restaurant_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  restaurant-service:
    container_name: pedidoscampus-restaurant-service
    build:
      context: ./microservices/restaurant-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://restaurant_user:${RESTAURANT_DB_PASSWORD:-restaurant_password}@restaurant-db:5432/restaurant_db
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      SECRET_KEY: ${ACCESS_TOKEN_SECRET}
      ALGORITHM: HS256
      DEBUG: "false"
    depends_on:
      restaurant-db:
        condition: service_healthy
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    container_name: pedidoscampus-order-db
    environment:
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:-order_password}
      POSTGRES_DB: order_db
    ports:
      - "5436:5432"
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    container_name: pedidoscampus-order-service
    build:
      context: ./microservices/order-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8002
      SERVER_ENV: development
      DATABASE_URL: postgres://order_user:${ORDER_DB_PASSWORD:-order_password}@order-db:5432/order_db?sslmode=disable
      DATABASE_LOG_LEVEL: info
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      NOTIFICACIONES_SERVICE_URL: ${NOTIFICACIONES_SERVICE_URL:-https://pedidoscampus-notificaciones.argoty-javier-3114.workers.dev}
      RESTAURANT_SERVICE_URL: http://restaurant-service:8001
      JWT_SECRET: ${ACCESS_TOKEN_SECRET}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
      RABBITMQ_QUEUE_PREFIX: order-service
      DELIVERY_COST: 2
      LOG_LEVEL: info
      LOG_FORMAT: json
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8002:8002"
    restart: unless-stopped

  rating-db:
    image: postgres:16-alpine
    container_name: pedidoscampus-rating-db
    environment:
      POSTGRES_USER: rating_user
      POSTGRES_PASSWORD: ${RATING_DB_PASSWORD:-rating_password}
      POSTGRES_DB: rating_db
    ports:
      - "5437:5432"
    volumes:
      - rating_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rating_user -d rating_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rating-service:
    container_name: pedidoscampus-rating-service
    build:
      context: ./microservices/rating-service
      dockerfile: Dockerfile
    environment:
      PORT: 8003
      RUST_LOG: info
      DATABASE_URL: postgresql://rating_user:${RATING_DB_PASSWORD:-rating_password}@rating-db:5432/rating_db?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
      RABBITMQ_QUEUE: rating-service
    depends_on:
      rating-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:8003"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pedidoscampus-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway-service:
    container_name: pedidoscampus-gateway
    build:
      context: ./microservices/gateway-service
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      JWT_SECRET: ${ACCESS_TOKEN_SECRET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:5000
      RESTAURANT_SERVICE_URL: http://restaurant-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      CALIFICACIONES_SERVICE_URL: http://rating-service:8003
      NOTIFICACIONES_SERVICE_URL: ${NOTIFICACIONES_SERVICE_URL:-https://pedidoscampus-notificaciones.argoty-javier-3114.workers.dev}
      AI_AGENT_SERVICE_URL: http://ai-agent-service:8004
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - user-service
      - restaurant-service
      - order-service
      - ai-agent-service
    restart: unless-stopped

  ai-agent-service:
    container_name: pedidoscampus-ai-agent-service
    build:
      context: ./microservices/ai-agent-service
      dockerfile: Dockerfile
    environment:
      PORT: 8004
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ORDER_SERVICE_URL: http://order-service:8002
      USER_SERVICE_URL: http://user-service:5000
      RESTAURANT_SERVICE_URL: http://restaurant-service:8001/api/v1
    ports:
      - "8004:8004"
    restart: unless-stopped

volumes:
  auth_postgres_data:
  user_postgres_data:
  restaurant_postgres_data:
  order_postgres_data:
  rating_postgres_data:
  rabbitmq_data:
